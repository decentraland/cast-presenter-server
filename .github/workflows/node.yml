name: node

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js 24.x
        uses: actions/setup-node@v4
        with:
          node-version: 24.x
          cache: yarn
      - name: install
        run: yarn install --frozen-lockfile
      - name: lint
        run: yarn lint
      - name: build
        run: yarn build
      - name: test
        run: yarn test --runInBand
  sidecar:
    runs-on: ubuntu-latest
    env:
      GOTOOLCHAIN: local
    steps:
      - uses: actions/checkout@v4
      - name: Use Go 1.26.x
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
          cache-dependency-path: sidecar/go.sum
      - name: vet
        working-directory: sidecar
        run: go vet ./...
      - name: test
        working-directory: sidecar
        run: go test -race ./...
      - name: build
        working-directory: sidecar
        run: CGO_ENABLED=0 go build ./cmd/cast-sidecar
