name: CI/CD on main branch

on:
  push:
    branches:
      - 'main'
      # TEMPORARY: deploys the client-composition stack's top branch to .zone for testing.
      # Remove this entry once the stack is merged, so only merges to main deploy again.
      - 'feat/enhance-cast'

jobs:
  cd:
    uses: decentraland/platform-actions/.github/workflows/apps-docker-next.yml@main
    with:
      service-name: cast-presenter-service
      deployment-environment: dev
    secrets: inherit
