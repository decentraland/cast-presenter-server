name: CI/CD on main branch

on:
  push:
    branches:
      - 'main'
      # TEMPORARY: builds the client-composition stack's top branch into a quay image, without deploying it.
      # Deploy it to .zone with the Manual deployment workflow and its commit sha as the tag.
      # Remove this entry and the branch conditions below once the stack is merged.
      - 'feat/client-played-videos'

jobs:
  cd:
    uses: decentraland/platform-actions/.github/workflows/apps-docker-next.yml@main
    with:
      service-name: cast-presenter-service
      deployment-environment: ${{ github.ref_name == 'main' && 'dev' || '' }}
      docker-tag: ${{ github.ref_name == 'main' && 'next' || 'client-played-videos' }}
    secrets: inherit
